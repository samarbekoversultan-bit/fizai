# Конфигурация Netlify
# Папка для публикации — текущая (в ней index.html).
# Примечание: файлы netlify/functions/* могут отдаваться как обычные
# статические файлы, но ключа внутри них нет — он задаётся переменной
# окружения GEMINI_API_KEY в настройках сайта, поэтому ничего секретного не утекает.
[build]
  publish = "."
  functions = "netlify/functions"

# Версия Node для серверных функций (chat.js и chat-stream.mjs).
# Node 20 нужен для потоковых ответов Netlify Functions v2.
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Старая ссылка на файл раньше переименования — чтобы не ломалась
[[redirects]]
  from = "/fizai_ai_physics_tutor.html"
  to = "/"
  status = 301
